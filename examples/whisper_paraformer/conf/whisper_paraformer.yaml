# This is an example that demonstrates how to configure a model file.
# You can modify the configuration according to your own requirements.

# to print the register_table:
# from funasr.register import tables
# tables.print()

# network architecture
model: WhisperParaformer
model_conf:
    lsm_weight: 0.1     # label smoothing option
    length_normalized_loss: true

# encoder
encoder: /ssd/zhuang/code/LLM/whisper-large-v3-ms/Whisper-large-v3
encoder_conf:
    hub: ms
    freeze: true

# decoder
decoder: ParaformerV2SANDecoder
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    input_layer: linear


specaug: SpecAugLFR
specaug_conf:
    apply_time_warp: false
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 30
    lfr_rate: 6
    num_freq_mask: 1
    apply_time_mask: true
    time_mask_width_range:
    - 0
    - 12
    num_time_mask: 1

#train_conf:
#  accum_grad: 1
#  grad_clip: 5
#  max_epoch: 10
#  keep_nbest_models: 10
#  log_interval: 300

train_conf:
  accum_grad: 1
  grad_clip: 5
  max_epoch: 5
  keep_nbest_models: 10
  log_interval: 300

optim: adamw
optim_conf:
   lr: 0.0001
   weight_decay: 0.000000

scheduler: warmuplr
scheduler_conf:
#   warmup_steps: 3000
    warmup_steps: 1500


# frontend related
frontend: WhisperFrontend
frontend_conf:
    fs: 16000
    whisper_model: large-v3
    do_pad_trim: true
    permute: true # true: [bs, frames, dims]; false: [bs, dims, frames]

dataset: WhisperAudioDataset
dataset_conf:
    index_ds: IndexDSJsonl
    batch_sampler: CustomDistributedBatchSampler
    batch_type: example # example or length
    batch_size: 4 # if batch_type is example, batch_size is the numbers of samples; if length, batch_size is source_token_len+target_token_len;
    max_token_length: 3000 # filter samples if source_token_len+target_token_len > max_token_length,
    shuffle: True
    num_workers: 4
    preprocessor_speech: SpeechPreprocessSpeedPerturb
    preprocessor_speech_conf:
      speed_perturb: [ 0.9, 1.0, 1.1 ]


tokenizer: G2PTokenizer
tokenizer_conf:
  language: en
  symbol_table_path: /ssd/zhuang/code/FunASR/funasr/tokenizer/g2p_tokenizer_utils/vocab_2.json
  special_tokens:
    <blank>: 0
    <unk>: 3
    <sos>: 1
    <eos>: 2


ctc_conf:
    dropout_rate: 0.0
    ctc_type: builtin
    reduce: true
    ignore_nan_grad: true
normalize: null
